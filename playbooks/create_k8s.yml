---
- name: Create k8s Cluster
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cluster_config.yml
  tasks:
    - name: Check for IP collision between host network and pod CIDR
      ansible.builtin.command: >-
        python3 -c 'import sys, ipaddress; sys.exit(1 if ipaddress.ip_address("{{ ansible_facts["default_ipv4"]["address"] | default(ansible_facts["all_ipv4_addresses"][0]) }}") in ipaddress.ip_network("{{ pod_network_cidr }}", strict=False) else 0)'
      register: cidr_collision_check
      failed_when: false
      changed_when: false

    - name: Halt on Pod CIDR and host subnet collision
      ansible.builtin.fail:
        msg: >-
          Host IP ({{ ansible_facts['default_ipv4']['address'] | default(ansible_facts['all_ipv4_addresses'][0]) }}) on {{ inventory_hostname }} is inside pod_network_cidr ({{ pod_network_cidr }}).
          This overlap causes routing deadlocks and breaks pod-to-node/API server traffic.
          Please pass a non-overlapping pod_network_cidr (e.g. -e pod_network_cidr=10.244.0.0/16 or -e pod_network_cidr=172.16.0.0/16) or update vars/cluster_config.yml.
          To bypass this check, pass -e allow_cidr_collision=true.
      when:
        - cidr_collision_check.rc == 1
        - not (allow_cidr_collision | default(false) | bool)

    - name: Run Prerequisites Check
      ansible.builtin.include_tasks: ../tasks/prerequisites.yml
      when: run_prerequisites | default(false) | bool

    - name: Importing basic setup tasks
      ansible.builtin.include_tasks: ../basic_setup/system_settings.yml
    - name: Installing Kubernetes packages
      ansible.builtin.include_tasks: ../tasks/install_kubernetes.yml
    - name: Importing crio tasks
      ansible.builtin.include_tasks: ../crio/cri-o.yml
      when: runtime == "crio"
    - name: Importing containerd tasks
      ansible.builtin.include_tasks: ../containerd/containerd.yml
      when: runtime == "containerd"

    # ---- Ensure CNI plugin binaries exist ----
    - name: Ensure /opt/cni/bin directory exists
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Verify if CNI plugin binaries already exist
      ansible.builtin.stat:
        path: /opt/cni/bin/bridge
      register: cni_bin_check

    - name: Download and extract CNI plugins
      ansible.builtin.unarchive:
        src: "{{ cni_plugins_url }}"
        dest: /opt/cni/bin
        remote_src: true
      when: 
        - not (cni_bin_check.stat.exists | default(false))
        - not (offline_install | bool)
    # ---- Control Plane Init (first master only) ----
    - name: Check if Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kube_admin_conf
      when: inventory_hostname == groups['controlplane'][0]

    - name: Init cluster on first control plane node
      ansible.builtin.command: >-
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --control-plane-endpoint={{ control_plane_endpoint }}:6443
        --upload-certs
        --ignore-preflight-errors={{ ignore_preflight_errors }}
      register: output_init
      failed_when: output_init.rc != 0 and 'already exists' not in (output_init.stderr | default(''))
      changed_when: output_init.rc == 0
      when: 
        - inventory_hostname == groups['controlplane'][0]
        - not (kube_admin_conf.stat.exists | default(false))

    - name: "#########################################################"
      ansible.builtin.debug:
        msg: "##### KUBERNETES INIT OUTPUT #####"
      when: inventory_hostname == groups['controlplane'][0]

    - name: Show init success/output
      ansible.builtin.debug:
        var: output_init.stdout_lines
      when: 
        - inventory_hostname == groups['controlplane'][0]
        - output_init.stdout_lines is defined

    - name: Show init errors (if any)
      ansible.builtin.debug:
        var: output_init.stderr_lines
      when: 
        - inventory_hostname == groups['controlplane'][0]
        - output_init.stderr_lines is defined and (output_init.stderr_lines | length > 0)

    # ---- Kubeconfig on first master ----
    - name: Ensure .kube directory exists (first control plane)
      ansible.builtin.file:
        path: "~{{ kube_user }}/.kube"
        state: directory
        mode: "0755"
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
      when: inventory_hostname == groups['controlplane'][0]

    - name: Copy kubeconfig (first control plane)
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "~{{ kube_user }}/.kube/config"
        remote_src: true
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0644"
      when: inventory_hostname == groups['controlplane'][0]

    # ---- Apply CNI ----
    - name: Download Calico manifest (Online)
      ansible.builtin.get_url:
        url: "{{ cni_manifest_urls['calico'] }}"
        dest: /tmp/kube-calico.yml
        mode: "0644"
      when:
        - inventory_hostname == groups['controlplane'][0]
        - cni_plugin == "calico"
        - not (offline_install | bool)

    - name: Transfer CNI manifest (Offline)
      ansible.builtin.copy:
        src: "kube-{{ cni_plugin }}.yml"
        dest: "/tmp/kube-{{ cni_plugin }}.yml"
        mode: "0644"
      when: 
        - inventory_hostname == groups['controlplane'][0]
        - offline_install | bool

    - name: Set CALICO_IPV4POOL_CIDR in Calico manifest
      ansible.builtin.replace:
        path: /tmp/kube-calico.yml
        regexp: '(?m)^(\s*#\s*)?- name: CALICO_IPV4POOL_CIDR\n(\s*#\s*)?  value: ".*"'
        replace: '            - name: CALICO_IPV4POOL_CIDR\n              value: "{{ pod_network_cidr }}"'
      when:
        - inventory_hostname == groups['controlplane'][0]
        - cni_plugin == "calico"

    - name: Apply CNI {{ cni_plugin }}
      ansible.builtin.command: >-
        kubectl apply -f 
        {% if cni_plugin == 'calico' or (offline_install | bool) %}/tmp/kube-{{ cni_plugin }}.yml{% else %}{{ cni_manifest_urls[cni_plugin] }}{% endif %}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: inventory_hostname == groups['controlplane'][0]
      changed_when: false

    # ---- Join additional control plane nodes ----
    - name: Upload certs and get certificate key
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: upload_certs_output
      when: inventory_hostname == groups['controlplane'][0]
      changed_when: false

    - name: Extract certificate key
      ansible.builtin.set_fact:
        certificate_key: "{{ upload_certs_output.stdout_lines[-1] }}"
      when: inventory_hostname == groups['controlplane'][0]

    - name: Get join command
      ansible.builtin.command: kubeadm token create --print-join-command
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: join_command
      when: inventory_hostname == groups['controlplane'][0]
      changed_when: false

    - name: Check if node is already joined (non-primary master)
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf
      when: inventory_hostname != groups['controlplane'][0]

    - name: Join additional control plane nodes
      ansible.builtin.command: >-
        {{ hostvars[groups['controlplane'][0]].join_command.stdout }}
        --control-plane
        --certificate-key {{ hostvars[groups['controlplane'][0]].certificate_key }}
        --ignore-preflight-errors={{ ignore_preflight_errors }}
      when:
        - inventory_hostname in groups['controlplane']
        - inventory_hostname != groups['controlplane'][0]
        - hostvars[groups['controlplane'][0]].join_command.stdout is defined
        - not (kubelet_conf.stat.exists | default(false))
      register: cp_join_output
      failed_when: cp_join_output.rc != 0 and 'already exists' not in (cp_join_output.stderr | default(''))
      changed_when: cp_join_output.rc == 0

    - name: Show Control Plane Join Output
      ansible.builtin.debug:
        var: cp_join_output.stdout_lines
      when: 
        - inventory_hostname in groups['controlplane']
        - inventory_hostname != groups['controlplane'][0]
        - cp_join_output.stdout_lines is defined

    # ---- Kubeconfig on additional control plane nodes (optional) ----
    - name: Ensure .kube directory exists (additional control plane)
      ansible.builtin.file:
        path: "~{{ kube_user }}/.kube"
        state: directory
        mode: "0755"
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
      when:
        - kubeconfig_on_all_cp | bool
        - inventory_hostname in groups['controlplane']
        - inventory_hostname != groups['controlplane'][0]

    - name: Copy kubeconfig (additional control plane)
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "~{{ kube_user }}/.kube/config"
        remote_src: true
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: "0644"
      when:
        - kubeconfig_on_all_cp | bool
        - inventory_hostname in groups['controlplane']
        - inventory_hostname != groups['controlplane'][0]

    # ---- Join worker nodes ----
    - name: Show join command
      ansible.builtin.debug:
        msg: "{{ hostvars[groups['controlplane'][0]].join_command.stdout }}"
      when: hostvars[groups['controlplane'][0]].join_command.stdout is defined

    - name: Join worker nodes
      ansible.builtin.command: "{{ hostvars[groups['controlplane'][0]].join_command.stdout }} --ignore-preflight-errors={{ ignore_preflight_errors }}"
      when:
        - inventory_hostname in groups['worker']
        - hostvars[groups['controlplane'][0]].join_command is defined
        - not hostvars[groups['controlplane'][0]].join_command.skipped | default(false)
        - not (kubelet_conf.stat.exists | default(false))
      register: worker_join_output
      failed_when: worker_join_output.rc != 0 and 'already exists' not in (worker_join_output.stderr | default(''))
      changed_when: worker_join_output.rc == 0

    - name: Show Worker Join Output
      ansible.builtin.debug:
        var: worker_join_output.stdout_lines
      when: 
        - inventory_hostname in groups['worker']
        - worker_join_output.stdout_lines is defined
