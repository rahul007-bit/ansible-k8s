---
# Upgrade Kubernetes cluster to a new version
# Usage: ansible-playbook -i hosts playbooks/upgrade_k8s.yml -e target_version=1.32
#
# Follows the official kubeadm upgrade procedure, split into two ordered
# plays so control-plane nodes are always fully upgraded before any worker
# node starts (no dependency on hosts-file ordering):
#   Play A (controlplane): version check, etcd snapshot, kubeadm upgrade
#     apply, drain, kubelet/kubectl upgrade, uncordon + health check.
#   Play B (worker): kubeadm upgrade node, drain, kubelet/kubectl upgrade,
#     uncordon + health check.
#
# Drain always runs AFTER kubeadm upgrade apply/node, never before: newer
# kubeadm (1.31+) runs its own preflight health-check Job that must schedule
# on the control-plane node itself, which fails if that node is already
# cordoned.
#
# Supports offline_install (see vars/cluster_config.yml) the same way
# create_k8s.yml does. Packages and images are staged from offline_pkg_path
# instead of hitting pkgs.k8s.io. Re-stage the target version bundle
# before running this playbook.
#
# On a control-plane upgrade failure, the playbook never rolls back on its
# own. It pauses for operator confirmation before restoring an etcd snapshot
# (see tasks/upgrade_control_plane_apply.yml).

- name: Stage offline images on every node before any kubeadm upgrade command
  # kubeadm's own preflight health-check Job (kubeadm upgrade plan/apply,
  # 1.31+) schedules on whichever node the default scheduler picks - not
  # necessarily the control-plane node being upgraded. If that node hasn't
  # been staged with the target version's images yet (e.g. a worker, which
  # Play B wouldn't touch until after Play A finishes), the Job's pod hangs
  # pulling from the network and blows kubeadm's fixed 15s timeout on
  # airgapped hosts. Load images everywhere up front to avoid that race.
  hosts: "{{ (groups['controlplane'] | default([])) + (groups['worker'] | default([])) }}"
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cluster_config.yml
  tasks:
    - name: Stage offline packages/images
      ansible.builtin.include_tasks: ../tasks/offline_package_prep.yml
      when: offline_install | bool
    - name: Load offline container images
      ansible.builtin.include_tasks: ../tasks/offline_image_load.yml
      when: offline_install | bool

- name: Upgrade Kubernetes Cluster (Control Plane)
  hosts: "{{ groups['controlplane'] }}"
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - ../vars/cluster_config.yml
  pre_tasks:
    - name: Validate target_version and version gap
      ansible.builtin.include_tasks: ../tasks/upgrade_version_check.yml
      when: inventory_hostname == groups['controlplane'][0]

    - name: Snapshot etcd before upgrade
      ansible.builtin.include_tasks: ../tasks/upgrade_etcd_backup.yml
      when: inventory_hostname == groups['controlplane'][0]

    - name: Verify offline bundle is staged
      ansible.builtin.include_tasks: ../tasks/upgrade_offline_preflight.yml
      when: offline_install | bool
  tasks:
    - name: Upgrade kubeadm
      ansible.builtin.include_tasks: ../tasks/upgrade_kubeadm.yml

    - name: Run kubeadm upgrade (control plane)
      ansible.builtin.include_tasks: ../tasks/upgrade_control_plane_apply.yml

    - name: Drain node before upgrade
      ansible.builtin.include_tasks: ../tasks/upgrade_drain.yml
      when: not (skip_drain | default(false) | bool)

    - name: Upgrade kubelet and kubectl
      ansible.builtin.include_tasks: ../tasks/upgrade_kubelet_kubectl.yml

    - name: Uncordon and verify node health
      ansible.builtin.include_tasks: ../tasks/upgrade_uncordon_healthcheck.yml

- name: Upgrade Kubernetes Cluster (Workers)
  hosts: "{{ groups['worker'] | default([]) }}"
  become: true
  gather_facts: true
  serial: 1
  vars_files:
    - ../vars/cluster_config.yml
  pre_tasks:
    - name: Fail if target_version is not set
      ansible.builtin.fail:
        msg: "You must specify target_version. Example: -e target_version=1.29"
      when: target_version == ""

    - name: Verify offline bundle is staged
      ansible.builtin.include_tasks: ../tasks/upgrade_offline_preflight.yml
      when: offline_install | bool
  tasks:
    - name: Upgrade kubeadm
      ansible.builtin.include_tasks: ../tasks/upgrade_kubeadm.yml

    - name: Run kubeadm upgrade (worker)
      ansible.builtin.include_tasks: ../tasks/upgrade_worker_node.yml

    - name: Drain node before upgrade
      ansible.builtin.include_tasks: ../tasks/upgrade_drain.yml
      when: not (skip_drain | default(false) | bool)

    - name: Upgrade kubelet and kubectl
      ansible.builtin.include_tasks: ../tasks/upgrade_kubelet_kubectl.yml

    - name: Uncordon and verify node health
      ansible.builtin.include_tasks: ../tasks/upgrade_uncordon_healthcheck.yml
