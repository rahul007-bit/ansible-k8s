---
# Upgrade a single Kubernetes node in place, run directly ON that node -
# for clusters where the ansible controller can't reach every node from
# one place (no cross-node SSH allowed). Install ansible on each node and
# invoke this playbook there against a copy of the repo's `hosts` file
# with the OTHER role's group commented out and this node's line switched
# to a local connection - see the "upgrade_k8s_local.yml" block at the
# bottom of `hosts` for the exact toggle. On the control-plane node that's:
#   [controlplane]
#   node1 ansible_connection=local
# and on a worker:
#   [worker]
#   node2 ansible_connection=local
#
# Upgrade control-plane node(s) to completion FIRST, then each worker one
# at a time - each invocation only ever sees itself, so nothing here
# orchestrates that order for you.
#
# Worker nodes don't get /etc/kubernetes/admin.conf by default, but drain/
# uncordon need a working kubeconfig against the apiserver (reachable over
# the network - only SSH is blocked). Stage one on the worker out-of-band
# before running this, at the path tasks/upgrade_drain.yml and
# tasks/upgrade_uncordon_healthcheck.yml use (KUBECONFIG=/etc/kubernetes/
# admin.conf) - e.g. copy the control-plane's admin.conf over by hand.
#
# Same offline_install support as upgrade_k8s.yml (vars/cluster_config.yml).
#
# Usage (on each node, against its own toggled copy of `hosts`):
#   ansible-playbook -i hosts playbooks/upgrade_k8s_local.yml -e target_version=1.36.3

- name: Upgrade Kubernetes node (local, no cross-node SSH)
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cluster_config.yml
  pre_tasks:
    - name: Stage offline packages/images
      ansible.builtin.include_tasks: ../tasks/offline_package_prep.yml
      when: offline_install | bool

    - name: Load offline container images
      ansible.builtin.include_tasks: ../tasks/offline_image_load.yml
      when: offline_install | bool

    - name: Validate target_version and version gap
      ansible.builtin.include_tasks: ../tasks/upgrade_version_check.yml
      when: inventory_hostname in groups.get('controlplane', [])

    - name: Snapshot etcd before upgrade
      ansible.builtin.include_tasks: ../tasks/upgrade_etcd_backup.yml
      when: inventory_hostname in groups.get('controlplane', [])

    - name: Fail if target_version is not set (worker)
      ansible.builtin.fail:
        msg: "You must specify target_version. Example: -e target_version=1.29"
      when:
        - inventory_hostname in groups.get('worker', [])
        - target_version == ""

    - name: Verify offline bundle is staged
      ansible.builtin.include_tasks: ../tasks/upgrade_offline_preflight.yml
      when: offline_install | bool
  tasks:
    - name: Upgrade kubeadm
      ansible.builtin.include_tasks: ../tasks/upgrade_kubeadm.yml

    - name: Run kubeadm upgrade (control plane)
      ansible.builtin.include_tasks: ../tasks/upgrade_control_plane_apply.yml
      when: inventory_hostname in groups.get('controlplane', [])

    - name: Run kubeadm upgrade (worker)
      ansible.builtin.include_tasks: ../tasks/upgrade_worker_node.yml
      when: inventory_hostname in groups.get('worker', [])

    - name: Drain node before upgrade
      ansible.builtin.include_tasks: ../tasks/upgrade_drain.yml
      when: not (skip_drain | default(false) | bool)

    - name: Upgrade kubelet and kubectl
      ansible.builtin.include_tasks: ../tasks/upgrade_kubelet_kubectl.yml

    - name: Uncordon and verify node health
      ansible.builtin.include_tasks: ../tasks/upgrade_uncordon_healthcheck.yml
