---
# Stop kubelet and every running container before restarting/upgrading
# CRI-O. Container processes live in kubepods.slice, not crio.service's own
# cgroup, so systemd's KillMode=control-group on crio.service never touches
# them - restarting CRI-O with containers still alive (including static pods
# like etcd/apiserver, which kubectl drain never evicts) leaves them
# orphaned. The new CRI-O process can't cleanly reconcile a stale container
# it has no record of, gets stuck retrying forever (crio.service has
# TimeoutStartUSec=infinity), and the RPM upgrade scriptlet hangs with it.
# Stopping kubelet first prevents it from immediately recreating containers
# while we tear them down against the still-functional OLD CRI-O.
#
# CRI-O-UPGRADE ONLY. Never include this from the Kubernetes component upgrade
# path (playbooks/upgrade_k8s.yml). `crictl stop` kills the static pod
# containers too - etcd and kube-apiserver - and with kubelet stopped nothing
# recreates them, so `kubeadm upgrade apply` (which needs a live API server to
# read/write the ClusterConfiguration ConfigMap) fails, as do the drain and
# uncordon tasks that delegate kubectl to groups['controlplane'][0]. It also
# buys nothing there: a kubelet/kubeadm package swap does not replace the
# CRI-O socket, so there is no stale-container reconciliation to avoid, and
# kubeadm recreates the static pods by rewriting their manifests.
#
# The caller must opt in explicitly via crio_restart_intended (see the guard
# below) so this can never be picked up by accident.

- name: Guard - refuse to run outside a CRI-O restart/upgrade flow
  ansible.builtin.assert:
    that: crio_restart_intended | default(false) | bool
    fail_msg: >
      upgrade_crio_stop_containers.yml was included without
      crio_restart_intended=true. This task file stops kubelet and every
      running container (including the etcd/kube-apiserver static pods) and is
      only safe when CRI-O itself is about to be restarted or upgraded. It
      will break the Kubernetes component upgrade path. Include it only from
      playbooks/upgrade_crio.yml, passing crio_restart_intended: true.
    success_msg: "CRI-O restart intended - proceeding to stop kubelet and containers"

- name: Stop kubelet before CRI-O restart
  ansible.builtin.systemd:
    name: kubelet
    state: stopped

- name: List running containers
  ansible.builtin.command: crictl ps -q
  register: running_containers
  changed_when: false
  failed_when: false

- name: Stop all running containers before CRI-O restart
  ansible.builtin.command: "crictl stop --timeout 30 {{ running_containers.stdout_lines | join(' ') }}"
  when: running_containers.stdout_lines | length > 0
  changed_when: true
  failed_when: false
