---
# Shared task: Install Kubernetes packages (kubeadm, kubelet, kubectl)
# Uses kube_version variable from create_k8s.yml (e.g., "1.32" or a full
# patch like "1.32.13")
#
# pkgs.k8s.io repos are keyed by MINOR version only (v1.32, never v1.32.13) -
# derive that separately so a full patch version still resolves a repo that
# exists, while package installs below keep the full kube_version for
# precise pinning.

- name: Derive minor version for the pkgs.k8s.io repo path
  ansible.builtin.set_fact:
    kube_minor_version: "{{ kube_version | regex_search('^\\d+\\.\\d+') }}"

- name: Handle Offline Package Preparation
  ansible.builtin.include_tasks: offline_package_prep.yml
  when: offline_install | bool
- name: Setup Repositories (Online)
  when: not (offline_install | bool)
  block:
    - name: Ensure keyrings directory exists (Ubuntu)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Download Kubernetes GPG key (Ubuntu)
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release-key.gpg
        mode: "0644"
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: De-armor and install Kubernetes GPG key (Ubuntu)
      ansible.builtin.shell: >
        gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release-key.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install Kubernetes repository (Ubuntu)
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: [deb]
        uris: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/"
        suites: ["/"]
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        install_python_debian: true
        state: present
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Update apt cache (Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove broken legacy cri-o.repo (Fedora/RHEL/CentOS)
      ansible.builtin.file:
        path: /etc/yum.repos.d/cri-o.repo
        state: absent
      when: ansible_facts['distribution'] in ['Fedora', 'RedHat', 'CentOS']

    - name: Install Kubernetes repository (Fedora/RHEL/CentOS)
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/rpm/repodata/repomd.xml.key"
        enabled: true
      when: ansible_facts['distribution'] in ['Fedora', 'RedHat', 'CentOS']

- name: Installing kubelet, kubeadm, and kubectl (Ubuntu)
  ansible.builtin.apt:
    name:
      - "kubelet={{ kube_version }}*"
      - "kubeadm={{ kube_version }}*"
      - "kubectl={{ kube_version }}*"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  when: 
    - ansible_facts['distribution'] == 'Ubuntu'
    - not (offline_install | bool)
- name: Installing kubelet, kubeadm, and kubectl (RHEL/CentOS/Fedora)
  ansible.builtin.dnf:
    name:
      - "kubelet-{{ kube_version }}*"
      - "kubeadm-{{ kube_version }}*"
      - "kubectl-{{ kube_version }}*"
    state: present
    allow_downgrade: true
    disable_gpg_check: true
  when: 
    - ansible_facts['distribution'] in ['Fedora', 'RedHat', 'CentOS']
    - not (offline_install | bool)
- name: Installing Kubernetes packages from local files (Offline - RPM)
  ansible.builtin.shell: "rpm -Uvh --replacepkgs --oldpackage $(find {{ remote_pkg_dir }} -name '*.rpm')"
  when: 
    - offline_install | bool
    - ansible_facts['distribution'] in ['Fedora', 'RedHat', 'CentOS']

- name: Installing Kubernetes packages from local files (Offline - DEB)
  ansible.builtin.shell: "dpkg -i {{ remote_pkg_dir }}/**/*.deb || apt-get install -f -y"
  when: 
    - offline_install | bool
    - ansible_facts['distribution'] == 'Ubuntu'

- name: Enabling kubelet service
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: true
