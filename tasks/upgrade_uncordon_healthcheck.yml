---
# Uncordon the current host after its upgrade, then wait for it to actually
# report Ready before the serial loop moves on to the next node.

- name: Uncordon node after upgrade
  # Retries absorb a transient race right after a kubelet/CRI-O restart: the
  # apiserver can still be finishing RBAC sync for a few seconds, returning
  # "Forbidden" for kubernetes-admin even though the credentials are fine.
  ansible.builtin.command: kubectl uncordon {{ ansible_hostname }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['controlplane'][0] }}"
  register: uncordon_result
  retries: 6
  delay: 5
  until: uncordon_result.rc == 0
  changed_when: true

- name: Show Uncordon Output
  ansible.builtin.debug:
    var: uncordon_result.stdout_lines
  delegate_to: "{{ groups['controlplane'][0] }}"
  when: uncordon_result.stdout_lines is defined

- name: Wait for node to report Ready after upgrade
  ansible.builtin.shell: >
    kubectl get node {{ ansible_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ groups['controlplane'][0] }}"
  register: node_ready
  retries: 12
  delay: 10
  until: node_ready.stdout == "True"
  changed_when: false

- name: Verify control-plane static pods are Running after upgrade
  # kubectl get node reporting Ready only reflects kubelet's own health, not
  # whether THIS node's own static pods actually came back up. kubeadm
  # upgrade apply rewrites the etcd/apiserver/scheduler/controller-manager
  # manifests, and a kubelet-side race can occasionally leave one silently
  # stuck Exited/CrashLoopBackOff while the node still reports Ready - the
  # next hop's `kubeadm upgrade apply` then fails immediately trying to read
  # the kubeadm-config ConfigMap ("connection refused" on :6443), pointing at
  # the wrong version entirely. Catch it here, one hop earlier, instead.
  # Proven manual fix (hit twice in prod) was a plain kubelet restart, so
  # that's the one recovery attempt made automatically before failing for
  # real.
  block:
    - name: Check static pod phase
      ansible.builtin.command: >
        kubectl get pod -n kube-system {{ item }}-{{ ansible_hostname }}
        -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['controlplane'][0] }}"
      loop:
        - etcd
        - kube-apiserver
        - kube-scheduler
        - kube-controller-manager
      register: static_pod_phase
      retries: 12
      delay: 10
      until: static_pod_phase.stdout == "Running"
      changed_when: false
  rescue:
    - name: Restart kubelet to recover stuck static pods
      ansible.builtin.systemd:
        name: kubelet
        state: restarted

    - name: Re-check static pod phase after kubelet restart
      ansible.builtin.command: >
        kubectl get pod -n kube-system {{ item }}-{{ ansible_hostname }}
        -o jsonpath='{.status.phase}'
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      delegate_to: "{{ groups['controlplane'][0] }}"
      loop:
        - etcd
        - kube-apiserver
        - kube-scheduler
        - kube-controller-manager
      register: static_pod_phase_retry
      retries: 12
      delay: 10
      until: static_pod_phase_retry.stdout == "Running"
      changed_when: false
  when: inventory_hostname in groups['controlplane']

- name: Check kubelet version
  ansible.builtin.command: kubelet --version
  register: kubelet_ver
  changed_when: false

- name: Show upgraded versions
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} ({{ ansible_hostname }}): {{ kubelet_ver.stdout }}"
