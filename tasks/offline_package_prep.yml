---
# Shared task: stage offline packages/images from offline_pkg_path onto the
# remote node (remote_pkg_dir / remote_images_dir). Included wherever
# offline_install packages/images are needed (create + upgrade flows).

- name: Ensure remote package directory exists
  ansible.builtin.file:
    path: "{{ remote_pkg_dir }}"
    state: directory
    mode: "0755"

- name: Ensure remote images directory exists
  ansible.builtin.file:
    path: "{{ remote_images_dir }}"
    state: directory
    mode: "0755"

- name: Transfer and extract packages from Controller (Zip)
  ansible.builtin.unarchive:
    src: "{{ offline_pkg_path }}"
    dest: "{{ remote_pkg_dir }}"
    remote_src: false
  when:
    - offline_pkg_source == 'controller'
    - offline_pkg_type == 'zip'

- name: Extract packages already on Remote (Zip)
  ansible.builtin.unarchive:
    src: "{{ offline_pkg_path }}"
    dest: "{{ remote_pkg_dir }}"
    remote_src: true
  when:
    - offline_pkg_source == 'remote'
    - offline_pkg_type == 'zip'

- name: Transfer packages from Controller (Directory)
  ansible.builtin.copy:
    src: "{{ offline_pkg_path }}/rpms/"
    dest: "{{ remote_pkg_dir }}/"
  when:
    - offline_pkg_source == 'controller'
    - offline_pkg_type == 'dir'

- name: Transfer images from Controller (Directory)
  ansible.builtin.copy:
    src: "{{ offline_pkg_path }}/images/"
    dest: "{{ remote_images_dir }}/"
  when:
    - offline_pkg_source == 'controller'
    - offline_pkg_type == 'dir'
