---
# Drain the current host before its kubeadm/kubelet upgrade steps run.

- name: "#########################################################"
  ansible.builtin.debug:
    msg: "##### DRAINING NODE: {{ ansible_facts['hostname'] }} #####"
  delegate_to: "{{ kubectl_delegate_host }}"

- name: Warn that PodDisruptionBudgets are being bypassed
  ansible.builtin.debug:
    msg: >-
      drain_ignore_pdb is true - draining {{ ansible_facts['hostname'] }} with
      --disable-eviction. Pods will be force-deleted without consulting their
      PodDisruptionBudgets.
  when: drain_ignore_pdb | default(false) | bool

# --force only covers bare pods that have no controller; it does NOT bypass
# PodDisruptionBudgets. Only --disable-eviction does, by skipping the eviction
# API and deleting pods directly.
- name: Drain node before upgrade
  ansible.builtin.command: >
    kubectl drain {{ ansible_facts['hostname'] }}
    --ignore-daemonsets
    --delete-emptydir-data
    --force
    {% if drain_ignore_pdb | default(false) | bool %}--disable-eviction{% endif %}
    --grace-period=60
    --timeout=5m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ kubectl_delegate_host }}"
  retries: 3
  delay: 10
  register: drain_result
  until: drain_result.rc == 0
  changed_when: true

- name: Show Drain Output
  ansible.builtin.debug:
    var: drain_result.stdout_lines
  delegate_to: "{{ kubectl_delegate_host }}"
  when: drain_result.stdout_lines is defined
