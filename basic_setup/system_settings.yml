---
- block:
    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure SELinux is set to permissive mode
      ansible.posix.selinux:
        policy: targeted
        state: permissive
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Disable SELinux immediately
      ansible.builtin.command: setenforce 0
      failed_when: false
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Ensure hostname is resolvable in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^{{ ansible_facts["default_ipv4"]["address"] | default(ansible_facts["all_ipv4_addresses"][0]) }}'
        line: "{{ ansible_facts['default_ipv4']['address'] | default(ansible_facts['all_ipv4_addresses'][0]) }} {{ inventory_hostname }}"
        state: present

    - name: Ensure firewalld is running and enabled (RHEL/Fedora)
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      when:
        - firewall_enabled | bool
        - ansible_facts['distribution'] in ["Fedora", "CentOS", "RHEL", "RedHat", "Rocky"]

    - name: Configure firewalld ports (RHEL/Fedora)
      ansible.posix.firewalld:
        port: "{{ item.port }}/{{ item.proto }}"
        permanent: true
        state: enabled
        immediate: true
      loop: "{{ firewall_allowed_ports_common + firewall_allowed_ports_cni[cni_plugin] }}"
      when: 
        - firewall_enabled | bool
        - ansible_facts['distribution'] in ["Fedora", "CentOS", "RHEL", "RedHat", "Rocky"]

    - name: Configure ufw ports (Ubuntu/Debian)
      community.general.ufw:
        rule: allow
        port: "{{ item.port | string | replace('-', ':') }}"
        proto: "{{ item.proto }}"
      loop: "{{ firewall_allowed_ports_common + firewall_allowed_ports_cni[cni_plugin] }}"
      when: 
        - firewall_enabled | bool
        - ansible_facts['distribution'] in ["Ubuntu", "Debian"]

    - name: Setup networking kernel modules for kubernetes (persist across reboot)
      ansible.builtin.blockinfile:
        path: /etc/modules-load.d/kubernetes.conf
        block: |
          overlay
          br_netfilter
          vxlan
        backup: true
        create: true
        mode: "0644"
      # overlay/br_netfilter are required regardless of container runtime
      # (CRI-O and containerd both need them); vxlan is flannel's default
      # backend. This file used to be written only when runtime == containerd
      # and never survived a reboot on CRI-O nodes - br_netfilter/vxlan would
      # silently vanish after a reboot, breaking flannel with
      # "stat /proc/sys/net/bridge/bridge-nf-call-iptables: no such file or
      # directory" and leaving pods stuck ContainerCreating.
    - name: Setup kernel parameters of kubernetes
      ansible.builtin.blockinfile:
        path: /etc/sysctl.d/kubernetes.conf
        block: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
        backup: true
        create: true
        mode: "0644"
    - name: Add the overlay module
      community.general.modprobe:
        name: overlay
        state: present
    - name: Add the br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present
    - name: Add the vxlan module
      community.general.modprobe:
        name: vxlan
        state: present
    - name: Reloading Sysctl
      become: true
      ansible.builtin.command: sysctl --system
      changed_when: false
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap permanently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n]+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Check whether zram-generator-defaults is installed (Fedora, CentOS, RedHat)
      ansible.builtin.command: rpm -q zram-generator-defaults
      register: zram_pkg_check
      failed_when: false
      changed_when: false
      when: ansible_facts['distribution'] in ["Fedora", "CentOS", "RedHat"]

    - name: Uninstall zram-generator package (Fedora, CentOS, RedHat)
      # Uses rpm directly instead of ansible.builtin.dnf: the dnf module
      # still invokes dnf's subscription-manager plugin even with
      # disablerepo: "*", which phones home and can hang for a long time on
      # airgapped hosts (fast online, slow/hanging offline).
      ansible.builtin.command: rpm -e zram-generator-defaults
      when:
        - ansible_facts['distribution'] in ["Fedora", "CentOS", "RedHat"]
        - zram_pkg_check.rc == 0
      become: true

    - name: Ensure ZRAM swap is disabled permanently (Fedora, CentOS, RedHat)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: ^([^#].*?\szram\s+.*)$
        replace: "# \\1"
      when: ansible_facts['distribution'] in ["Fedora", "CentOS", "RedHat"]

    - name: Remove any ZRAM swap configuration files (Fedora, CentOS, RedHat)
      ansible.builtin.file:
        path: /etc/systemd/system/zram.service
        state: absent
      register: zram_unit_removed
      when: ansible_facts['distribution'] in ["Fedora", "CentOS", "RedHat"]
      become: true

    - name: Reload systemd after removing ZRAM unit file
      ansible.builtin.systemd:
        daemon_reload: true
      when: zram_unit_removed.changed | default(false)
      become: true
