# vars/cluster_config.yml

# --- Global Settings ---
kube_user: "{{ ansible_user | default('ubuntu') }}"

# --- Prerequisite Settings ---
run_prerequisites: false

prereq_min_requirements:
  # You can define requirements by exact hostname (highest priority)
  prod-rhel9-main:
    ram_mb: 30000
    cpu_cores: 16
    disk_gb: 120
  prod-rhel9-model:
    ram_mb: 15000
    cpu_cores: 4
    disk_gb: 60
  # Or you can define requirements by node group (fallback)
  # controlplane:
  #   ram_mb: 4000
  #   cpu_cores: 2
  #   disk_gb: 20
  # worker:
  #   ram_mb: 2000
  #   cpu_cores: 2
  #   disk_gb: 20

prereq_external_mounts:
  - path: /external-volume
    nodes: "prod-rhel9-main"
    min_size_gb: 120

prereq_whitelisted_urls:
  - "https://github.com"
  - "https://private.azurecr.io"
  - "https://google.com"

# --- Offline Installation Settings ---
offline_install: false
offline_pkg_type: "dir"               # Options: "zip" or "dir"
offline_pkg_source: "remote"      # Options: "controller" (transfer from host) or "remote" (already on server)
offline_pkg_path: "/home/{{ kube_user }}/k8s_packages"       # Local path (if source=controller) or Remote path (if source=remote)
remote_pkg_dir: "/home/{{ kube_user }}/k8s_packages/rpms"  # Directory on remote node to store/extract packages
remote_images_dir: "/home/{{ kube_user }}/k8s_packages/images"  # Directory on remote node containing container image tars
ignore_preflight_errors: ""  # Errors to ignore during kubeadm init/join

# --- Installation Settings (create_k8s.yml) ---
runtime: crio  # Options: crio, containerd
kube_version: "1.36"
crio_version: "v1.36"
cni_plugins_version: "v1.6.2"
cni_plugins_url: "https://github.com/containernetworking/plugins/releases/download/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz"

# --- Networking Settings ---
cni_plugin: calico  # Options: calico, flannel
calico_version: v3.26.0
flannel_version: v0.28.3

# --- Firewall Settings ---
firewall_enabled: true
firewall_allowed_ports_common:
  - { port: "6443", proto: "tcp" }         # Kubernetes API server
  - { port: "2379-2380", proto: "tcp" }    # etcd server client API
  - { port: "10250", proto: "tcp" }        # Kubelet API
  - { port: "10251", proto: "tcp" }        # kube-scheduler
  - { port: "10252", proto: "tcp" }        # kube-controller-manager
  - { port: "30000-32767", proto: "tcp" }  # NodePort Services

firewall_allowed_ports_cni:
  calico:
    - { port: "179", proto: "tcp" }        # Calico BGP
    - { port: "4789", proto: "udp" }       # Calico VXLAN
  flannel:
    - { port: "8472", proto: "udp" }       # Flannel VXLAN

firewall_allowed_protocols_cni:
  calico:
    - { proto: "ipip" }                    # Calico IPIP encapsulation protocol
  flannel: []

firewall_cni_interfaces:
  calico:
    - "cali+"
    - "tunl0"
    - "vxlan.calico"
  flannel:
    - "flannel+"
    - "cni0"

# These are internal mappings for CNI manifests and CIDRs
# You can modify them if you need custom manifests or CIDRs
cni_manifest_urls:
  calico: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"
  flannel: "https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"

cni_default_cidrs:
  calico: "192.168.0.0/16"
  flannel: "10.244.0.0/16"

# If pod_network_cidr is not specified, it will use the default from above
pod_network_cidr: "{{ cni_default_cidrs[cni_plugin] }}"

# --- High Availability Settings ---
control_plane_endpoint: "{{ hostvars[groups['controlplane'][0]].ansible_host }}" # Auto-set to first master, override for LB
kubeconfig_on_all_cp: false

# --- Reset Settings (reset-k8s-cluster.yml) ---
remove_packages: false

# --- Upgrade Settings (upgrade_k8s.yml) ---
target_version: "1.30" # Should typically be passed via -e at runtime

# Delegate target for kubectl drain/uncordon during upgrades. Defaults to
# the first control-plane inventory host. Falls back to the node itself
# when no controlplane group is visible - the case for
# playbooks/upgrade_k8s_local.yml, run per-node with a single-host
# inventory and no cross-node SSH.
kubectl_delegate_host: >-
  {{ inventory_hostname if (groups['controlplane'] | default([]) | length == 0)
  else groups['controlplane'][0] }}

# Skip the drain/cordon step during upgrades.
#
# Set true when workloads are pinned to a node (nodeSelector/affinity) and
# have nowhere else to go - e.g. a 2-node cluster where app pods select the
# main node. Draining there is worse than not draining: eviction either gets
# blocked by PodDisruptionBudgets, or (if the PDBs are removed) the pods go
# Pending for the whole upgrade because no other node matches their selector.
# Without a drain, containers simply restart in place on the same node.
#
# For upgrade_k8s.yml specifically, a drain buys nothing regardless of
# topology: restarting kubelet does not kill running containers, so workloads
# survive a kubeadm/kubelet package upgrade untouched.
#
# For upgrade_crio.yml the node's containers ARE torn down either way (CRI-O
# is being replaced), so skipping the drain shortens the outage rather than
# creating one.
skip_drain: false

# Ignore PodDisruptionBudgets during drain (adds --disable-eviction).
#
# Bypasses the eviction API and force-deletes pods outright, so PDBs are not
# consulted at all. Use when a PDB can never be satisfied - e.g. a Deployment
# at replicas=1 behind minAvailable=1, or replicas concentrated on the node
# being drained.
#
# Two things to weigh before enabling:
#   - Quorum: force-deleting several members of a quorum-based StatefulSet
#     (etcd, zookeeper, consul) at once can take the datastore below quorum.
#     The PDB is usually the only thing preventing that.
#   - Pinned workloads: drain cordons the node first. Pods that are pinned
#     back to that same node via nodeSelector/affinity have nowhere to go and
#     stay Pending until the uncordon at the end of the node's upgrade. For
#     that topology skip_drain gives a shorter outage than this flag.
drain_ignore_pdb: false
interactive_rollback_prompt: true  # If a control-plane upgrade fails, pause and ask before restoring the etcd snapshot.
                                    # Set false for headless/CI runs (fails without prompting; still no automatic rollback).
